<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Apple Of Fortune Premium</title>

<meta name="theme-color" content="#ff0000">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#000;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
INSTALL BUTTON
========================= */

.install-btn-container{
    position:fixed;
    left:20px;
    right:20px;
    bottom:20px;
    z-index:9999;
}

.install-btn{

    width:100%;
    border:none;
    border-radius:60px;
    padding:18px;

    background:
    linear-gradient(135deg,#ff0000,#990000);

    color:white;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 10px 40px rgba(255,0,0,.5),
    inset 0 1px 1px rgba(255,255,255,.2);

    transition:.3s;
}

.install-btn:hover{
    transform:translateY(-5px);
}

.main{

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    min-height:100vh;

    padding:20px;
    text-align:center;
}

.logo{

    width:120px;
    height:120px;

    border-radius:30px;

    background:
    linear-gradient(135deg,#ff0000,#990000);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:60px;

    box-shadow:
    0 0 40px rgba(255,0,0,.6);

    margin-bottom:25px;
}

.title{

    font-size:34px;
    font-weight:900;

    background:
    linear-gradient(135deg,#ff0000,#ff6666);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.subtitle{

    color:#aaa;
    margin-bottom:40px;
}

.card{

    width:100%;
    max-width:400px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.1);

    border-radius:25px;

    padding:25px;

    backdrop-filter:blur(20px);
}

.stats{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.stat{

    background:rgba(255,255,255,.05);

    border-radius:20px;

    padding:20px;
}

.stat h2{
    color:#ff0000;
    margin-bottom:5px;
}

.toast{

    position:fixed;

    top:30px;
    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(135deg,#ff0000,#990000);

    padding:16px 22px;

    border-radius:16px;

    z-index:99999;

    font-weight:700;

    animation:fade .3s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:
        translateX(-50%)
        translateY(-20px);
    }

    to{
        opacity:1;
        transform:
        translateX(-50%)
        translateY(0);
    }
}

</style>
</head>
<body>

<div class="main">

    <div class="logo">
        🍎
    </div>

    <div class="title">
        Apple Of Fortune
    </div>

    <div class="subtitle">
        PREMIUM SIGNALS
    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <h2>98.5%</h2>
                <p>Aniqlik</p>
            </div>

            <div class="stat">
                <h2>2580</h2>
                <p>Online</p>
            </div>

            <div class="stat">
                <h2>$445</h2>
                <p>Daromad</p>
            </div>

            <div class="stat">
                <h2>VIP</h2>
                <p>Status</p>
            </div>

        </div>

    </div>

</div>

<div
id="installBtnContainer"
class="install-btn-container">
</div>

<script>

// ==============================
// TOAST
// ==============================

function showToast(message){

    const toast =
    document.createElement('div');

    toast.className='toast';

    toast.innerHTML=message;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3000);
}

// ==============================
// PWA INSTALL SYSTEM
// ==============================

(function () {

    let deferredPrompt = null;

    const installContainer =
        document.getElementById(
            'installBtnContainer'
        );

    // ==========================
    // APP INSTALLED?
    // ==========================

    function isInstalled() {

        return window.matchMedia(
            '(display-mode: standalone)'
        ).matches

        || window.navigator.standalone

        || document.referrer.includes(
            'android-app://'
        )

        || localStorage.getItem(
            'aofInstalled'
        ) === 'true';
    }

    // ==========================
    // HIDE BUTTON
    // ==========================

    function hideInstallButton() {

        if (!installContainer) return;

        installContainer.style.display='none';

        installContainer.innerHTML='';
    }

    // ==========================
    // SUCCESS SCREEN
    // ==========================

    function showInstallSuccess(){

        const div =
        document.createElement('div');

        div.innerHTML=`

        <div style="
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.95);

            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;

            z-index:999999;
            color:white;
        ">

            <div style="
                width:130px;
                height:130px;

                border-radius:35px;

                background:
                linear-gradient(
                135deg,
                #ff0000,
                #990000
                );

                display:flex;
                align-items:center;
                justify-content:center;

                font-size:70px;

                box-shadow:
                0 0 50px
                rgba(255,0,0,.7);
            ">
                ✅
            </div>

            <h1 style="
                margin-top:25px;
                font-size:32px;
            ">
                APP INSTALLED
            </h1>

            <p style="
                margin-top:10px;
                opacity:.8;
            ">
                Ilova muvaffaqiyatli o‘rnatildi
            </p>

        </div>
        `;

        document.body.appendChild(div);

        setTimeout(()=>{
            div.remove();
        },3000);
    }

    // ==========================
    // IOS?
    // ==========================

    function isIOS() {

        return /iphone|ipad|ipod/i.test(
            window.navigator.userAgent
        );
    }

    // ==========================
    // CREATE BUTTON
    // ==========================

    function createInstallButton(){

        if(!installContainer) return;

        installContainer.innerHTML='';

        const btn =
        document.createElement('button');

        btn.className='install-btn';

        btn.innerHTML=`
            <i class="fas fa-download"></i>
            📱 ILOVANI O'RNATISH
        `;

        btn.onclick = async ()=>{

            // vibratsiya

            if(navigator.vibrate){
                navigator.vibrate(
                    [100,50,100]
                );
            }

            // loading

            btn.innerHTML=`
                <i class="
                fas fa-spinner fa-spin
                "></i>
                Installing...
            `;

            // ======================
            // ANDROID PWA
            // ======================

            if(deferredPrompt){

                deferredPrompt.prompt();

                const { outcome } =
                await deferredPrompt.userChoice;

                if(outcome==='accepted'){

                    localStorage.setItem(
                        'aofInstalled',
                        'true'
                    );

                    hideInstallButton();

                    showInstallSuccess();

                }else{

                    btn.innerHTML=`
                    <i class="fas fa-download"></i>
                    📱 ILOVANI O'RNATISH
                    `;
                }

                deferredPrompt=null;

                return;
            }

            // ======================
            // IOS
            // ======================

            if(isIOS()){

                alert(
                "📱 Safari → Share → Add to Home Screen"
                );

                btn.innerHTML=`
                <i class="fas fa-download"></i>
                📱 ILOVANI O'RNATISH
                `;

                return;
            }

            // ======================
            // OTHER
            // ======================

            alert(
            "📱 Browser Menu → Add To Home Screen"
            );

            btn.innerHTML=`
            <i class="fas fa-download"></i>
            📱 ILOVANI O'RNATISH
            `;
        };

        installContainer.appendChild(btn);

        installContainer.style.display='block';
    }

    // ==========================
    // INSTALLED?
    // ==========================

    if(isInstalled()){

        hideInstallButton();

    }else{

        setTimeout(()=>{

            if(!isInstalled()){

                createInstallButton();
            }

        },2000);
    }

    // ==========================
    // BEFORE INSTALL
    // ==========================

    window.addEventListener(
    'beforeinstallprompt',

    (e)=>{

        e.preventDefault();

        deferredPrompt=e;

        if(!isInstalled()){

            createInstallButton();
        }
    });

    // ==========================
    // INSTALLED EVENT
    // ==========================

    window.addEventListener(
    'appinstalled',

    ()=>{

        localStorage.setItem(
            'aofInstalled',
            'true'
        );

        hideInstallButton();

        showInstallSuccess();

        showToast(
        "✅ App Installed!"
        );
    });

    // ==========================
    // CHECK LOOP
    // ==========================

    setInterval(()=>{

        if(isInstalled()){

            hideInstallButton();
        }

    },1000);

})();

// ==============================
// SERVICE WORKER
// ==============================

if('serviceWorker' in navigator){

    navigator.serviceWorker.register(
        'sw.js'
    );
}

</script>

</body>
</html>
