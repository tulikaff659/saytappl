<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>Apple Of Fortune Premium</title>

<meta name="theme-color" content="#ff0000"/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<script async src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:100px;
}

:root{
    --red:#ff0000;
    --dark:#111;
}

.main-container,
.page-container{
    display:none;
}

.main-container.active,
.page-container.active{
    display:block;
}

.app-header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111;
    border-bottom:2px solid var(--red);
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff0000,#990000);
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-text{
    font-size:20px;
    font-weight:bold;
    color:#ff3333;
}

.card{
    margin:20px;
    padding:20px;
    background:#111;
    border-radius:20px;
    border:2px solid rgba(255,0,0,0.2);
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:12px;
}

.btn-primary{
    background:linear-gradient(135deg,#ff0000,#990000);
    color:#fff;
}

.btn-secondary{
    background:#222;
    color:#fff;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat-box{
    background:#181818;
    padding:16px;
    border-radius:16px;
    text-align:center;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
    color:#ff3333;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    border-top:2px solid #ff0000;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    z-index:200;
}

.nav-item{
    flex:1;
    text-align:center;
    color:#777;
    cursor:pointer;
}

.nav-item.active{
    color:#ff0000;
}

.toast{
    position:fixed;
    top:20px;
    left:20px;
    right:20px;
    padding:16px;
    border-radius:16px;
    text-align:center;
    font-weight:bold;
    z-index:9999;
    animation:fade .3s;
}

.toast.success{
    background:#00aa00;
}

.toast.error{
    background:#cc0000;
}

.toast.info{
    background:#0066cc;
}

@keyframes fade{

from{
    opacity:0;
    transform:translateY(-20px);
}

to{
    opacity:1;
    transform:translateY(0);
}

}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:999;
}

.modal-content{
    width:100%;
    max-width:420px;
    background:#111;
    border:2px solid #ff0000;
    border-radius:20px;
    padding:20px;
}

.input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:2px solid #ff0000;
    background:#000;
    color:#fff;
    margin-top:15px;
}

.apples{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

.apple{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ff0000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    cursor:pointer;
}

.lang-screen{
    position:fixed;
    inset:0;
    background:#000;
    z-index:5000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.lang-btn{
    width:220px;
    padding:16px;
    margin:10px;
    border:none;
    border-radius:16px;
    background:#111;
    border:2px solid #ff0000;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.install-btn{
    position:fixed;
    bottom:100px;
    left:20px;
    right:20px;
    z-index:1000;
}

</style>

</head>

<body>

<div class="lang-screen" id="langScreen">

<h1 style="color:#ff0000;margin-bottom:30px;">
🍎 Apple Of Fortune
</h1>

<button class="lang-btn" onclick="selectLang('uz')">
🇺🇿 O'zbekcha
</button>

<button class="lang-btn" onclick="selectLang('ru')">
🇷🇺 Русский
</button>

<button class="lang-btn" onclick="selectLang('en')">
🇺🇸 English
</button>

</div>

<div id="installContainer"></div>

<div class="main-container active" id="homePage">

<header class="app-header">

<div class="logo">

<div class="logo-icon">
<i class="fas fa-apple-alt"></i>
</div>

<div class="logo-text">
APPLE PREMIUM
</div>

</div>

<div
style="cursor:pointer;"
onclick="showPage('settingsPage')">

<i class="fas fa-cog"></i>

</div>

</header>

<div class="card">

<h2>
🔥 PREMIUM SIGNALS
</h2>

<p style="margin-top:10px;color:#aaa;">
98.5% aniqlikdagi premium signallar
</p>

<button
class="btn btn-primary"
onclick="openSignalModal()">

⚡ SIGNAL OLISH

</button>

<button
class="btn btn-secondary"
onclick="joinTelegram()">

📢 TELEGRAM

</button>

</div>

<div class="card">

<div class="stats-grid">

<div class="stat-box">
<div class="stat-value">2580</div>
<div>ONLINE</div>
</div>

<div class="stat-box">
<div class="stat-value">98%</div>
<div>ANIQLIK</div>
</div>

<div class="stat-box">
<div class="stat-value">$445</div>
<div>DAROMAD</div>
</div>

<div class="stat-box">
<div class="stat-value">VIP</div>
<div>STATUS</div>
</div>

</div>

</div>

</div>

<div class="page-container" id="settingsPage">

<header class="app-header">

<div class="logo">

<div
class="logo-icon"
onclick="showPage('homePage')"
style="cursor:pointer;">

<i class="fas fa-arrow-left"></i>

</div>

<div class="logo-text">
SOZLAMALAR
</div>

</div>

</header>

<div class="card">

<button
class="btn btn-primary"
onclick="changeId()">

🆔 ID O'ZGARTIRISH

</button>

<button
class="btn btn-secondary"
onclick="resetApp()">

♻️ RESET

</button>

</div>

</div>

<div class="modal" id="signalModal">

<div class="modal-content">

<h2>
⚡ SIGNAL
</h2>

<input
type="number"
id="userId"
class="input"
placeholder="ID kiriting"
/>

<button
class="btn btn-primary"
onclick="verifyId()">

TASDIQLASH

</button>

<div
class="apples"
id="appleContainer"
style="display:none;">

</div>

<button
class="btn btn-primary"
id="revealBtn"
style="display:none;"
onclick="revealApple()">

🍎 SIGNAL KO'RISH

</button>

<button
class="btn btn-secondary"
onclick="closeModal()">

YOPISH

</button>

</div>

</div>

<nav class="bottom-nav">

<div
class="nav-item active"
onclick="showPage('homePage')">

<i class="fas fa-home"></i>

<div>ASOSIY</div>

</div>

<div
class="nav-item"
onclick="openSignalModal()">

<i class="fas fa-bolt"></i>

<div>SIGNAL</div>

</div>

<div
class="nav-item"
onclick="joinTelegram()">

<i class="fab fa-telegram"></i>

<div>TELEGRAM</div>

</div>

<div
class="nav-item"
onclick="showPage('settingsPage')">

<i class="fas fa-cog"></i>

<div>SETTINGS</div>

</div>

</nav>

<script>

let tg = null;

if(window.Telegram && window.Telegram.WebApp){

    tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();

}

function showToast(message,type='success'){

    const toast = document.createElement('div');

    toast.className = `toast ${type}`;

    toast.innerHTML = message;

    document.body.appendChild(toast);

    setTimeout(()=>{

        toast.remove();

    },3000);

}

function selectLang(lang){

    localStorage.setItem('lang',lang);

    document.getElementById(
        'langScreen'
    ).style.display='none';

    showToast('✅ Til saqlandi');

}

if(localStorage.getItem('lang')){

    document.getElementById(
        'langScreen'
    ).style.display='none';

}

function showPage(pageId){

    document
    .querySelectorAll(
        '.main-container,.page-container'
    )
    .forEach(page=>{

        page.classList.remove('active');

    });

    document
    .getElementById(pageId)
    .classList.add('active');

}

function joinTelegram(){

    window.open(
        'https://t.me/Strategioyinlar_bot',
        '_blank'
    );

    showToast(
        '✅ Telegram ochildi',
        'info'
    );

}

function openSignalModal(){

    document
    .getElementById(
        'signalModal'
    )
    .style.display='flex';

}

function closeModal(){

    document
    .getElementById(
        'signalModal'
    )
    .style.display='none';

}

function verifyId(){

    const val =
    document.getElementById(
        'userId'
    ).value;

    if(val.length < 9){

        showToast(
            '❌ ID noto‘g‘ri',
            'error'
        );

        return;

    }

    localStorage.setItem(
        'userId',
        val
    );

    showToast(
        '✅ ID tasdiqlandi'
    );

    createApples();

}

function createApples(){

    const cont =
    document.getElementById(
        'appleContainer'
    );

    cont.innerHTML='';

    cont.style.display='flex';

    document
    .getElementById(
        'revealBtn'
    )
    .style.display='block';

    for(let i=0;i<5;i++){

        const apple =
        document.createElement('div');

        apple.className='apple';

        apple.innerHTML='🍎';

        cont.appendChild(apple);

    }

}

function revealApple(){

    const apples =
    document.querySelectorAll('.apple');

    const lucky =
    Math.floor(Math.random()*5);

    apples.forEach((a,index)=>{

        if(index===lucky){

            a.innerHTML='💎';

            a.style.background='#00aa00';

        }else{

            a.innerHTML='❌';

            a.style.background='#990000';

        }

    });

    showToast(
        '🎉 Signal tayyor!'
    );

}

function changeId(){

    localStorage.removeItem('userId');

    showToast(
        '✅ ID o‘chirildi'
    );

}

function resetApp(){

    localStorage.clear();

    location.reload();

}

let deferredPrompt;

window.addEventListener(
'beforeinstallprompt',

(e)=>{

    e.preventDefault();

    deferredPrompt = e;

    showInstallButton();

});

function showInstallButton(){

    const div =
    document.getElementById(
        'installContainer'
    );

    div.innerHTML = `

    <button
    class="btn btn-primary install-btn"
    id="installBtn">

    📲 ILOVANI O‘RNATISH

    </button>

    `;

    document
    .getElementById('installBtn')
    .onclick = async()=>{

        if(deferredPrompt){

            deferredPrompt.prompt();

            const choice =
            await deferredPrompt.userChoice;

            if(choice.outcome==='accepted'){

                showToast(
                    '✅ Ilova o‘rnatildi'
                );

                div.innerHTML='';

            }

        }

    };

}

window.addEventListener(
'appinstalled',

()=>{

    showToast(
        '✅ APP O‘RNATILDI'
    );

    document
    .getElementById(
        'installContainer'
    )
    .innerHTML='';

});

</script>

</body>
</html>
